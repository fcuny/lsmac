name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o lsmac ./cmd/lsmac

      - name: smoke test
        run: |
          echo "::group::default view"
          ./lsmac
          echo "::endgroup::"
          echo "::group::--json"
          ./lsmac --json
          echo "::endgroup::"
          echo "::group::--section cpu"
          ./lsmac --section cpu
          echo "::endgroup::"
